name: Build Search

on:
  push:
    branches: [ ci-build ]
  workflow_dispatch:

jobs:
  build:
    strategy:
      matrix:
        os: [macos-14, macos-15]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app/Contents/Developer

      - name: Build Search.app
        run: ./build.sh

      - name: Zip Bundle
        run: ditto -c -k --keepParent build/Search.app Search.app.zip

      - name: Upload Search.app
        uses: actions/upload-artifact@v4
        with:
          name: Search-app-${{ matrix.os }}
          path: Search.app.zip
